apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-demo
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
      - name: nginx
        image: nginx:1.28

        ports:
        - containerPort: 80

  strategy:
    blueGreen:

      activeService: nginx-active

      previewService: nginx-preview

      autoPromotionEnabled: false

      scaleDownDelaySeconds: 60
