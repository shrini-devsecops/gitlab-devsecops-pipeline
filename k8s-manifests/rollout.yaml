apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-demo
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      imagePullSecrets:
      - name: ecr-secret 
      containers:
      - name: nginx
        image: 533267202595.dkr.ecr.us-east-1.amazonaws.com/argocd/sample-argocd-project:argocd-deployment-17ebaddd

        ports:
        - containerPort: 80

  strategy:
    blueGreen:

      activeService: nginx-active

      previewService: nginx-preview

      autoPromotionEnabled: false

      scaleDownDelaySeconds: 60
