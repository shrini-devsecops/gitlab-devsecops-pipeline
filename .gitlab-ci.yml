stages:
  - build
  - sign
  - gitops
  - security

variables:
  IMAGE_NAME: devsecops-demo
  CI_PROJECT_NAME: "sample-argocd-project"
  HELM_CHART_NAME: "helm-sample-argocd-project"
  ECR_NAMESPACE: "argocd"
  ECR_REGION: "us-east-1"
  ECR_REPO_NAME: "$ECR_NAMESPACE/$CI_PROJECT_NAME"
  ECR_DOCKER_SECRET: "ecr-secret"
  FULL_IMAGE: "$AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com/$ECR_NAMESPACE/$CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"


git_leaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]           # required for GitLab + gitleaks image
  variables:
    GIT_DEPTH: 0
  tags:
    - shared	
  script:
    - gitleaks version
    - gitleaks detect --source . --redact --no-banner \
        --report-format json --report-path gitleaks-report.json --exit-code 1
  after_script:
    - test -f gitleaks-report.json || echo '{}' > gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json

sonarqube_scan:
  stage: security
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - 'echo "Target SonarQube: ${SONAR_HOST_URL:-<unset>}"'
    - '[ -n "$SONAR_HOST_URL" ] || { echo "SONAR_HOST_URL CI/CD variable is not set"; exit 1; }'
    - '[ -n "$SONAR_TOKEN_DEV" ] || { echo "SONAR_TOKEN_DEV CI/CD variable is not set"; exit 1; }'
    - sonar-scanner -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.sources=. -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN_DEV -Dsonar.branch.name=$CI_COMMIT_BRANCH
  tags:
    - shared

docker_build:
  stage: build
  image: docker:latest
  before_script:
    - apk add --no-cache python3 py3-pip
    - apk add --no-cache aws-cli
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_DEV
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_DEV
    - export AWS_DEFAULT_REGION=$ECR_REGION
  script:
    - docker build -t $CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com/$ECR_NAMESPACE/$CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
    - aws configure set default.region $ECR_REGION    
    - aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" || aws ecr create-repository --repository-name "$ECR_REPO_NAME"
    - aws ecr get-login-password --region $ECR_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com
    - docker push $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com/$ECR_NAMESPACE/$CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  tags:
    - shared

# ─────────────────────────────────────────────────────────────
# NEW: Cosign image signing — runs right after build/push,
# before the image gets deployed via GitOps.
# Uses KEYLESS signing — no private key to manage or leak.
# Identity proof comes from GitLab's own OIDC token (id_tokens below).
# Signature + certificate get recorded in the public Rekor
# transparency log (like Certificate Transparency, but for images).
# ─────────────────────────────────────────────────────────────
sign_image:
  stage: sign
  # NOTE: gcr.io/projectsigstore/cosign is a DISTROLESS image — no shell,
  # so we use alpine + the cosign binary instead.
  #
  # Using KEY-BASED signing here instead of keyless OIDC signing.
  # Keyless (Fulcio) requires GitLab's OIDC issuer to be trusted by the
  # public Fulcio instance, which fails on GitLab.com shared runners /
  # free tier with a 400 "error processing the identity token" — this is
  # a known Fulcio/GitLab OIDC-audience trust gap, not a config mistake
  # on our side. Key-based signing avoids that dependency entirely and
  # is the simpler, faster path to a working demo.
  image: alpine:3.19
  variables:
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    COSIGN_VERSION: "v2.2.4"
  before_script:
    - apk add --no-cache curl aws-cli
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_DEV
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_DEV
    - export AWS_DEFAULT_REGION=$ECR_REGION
    - curl -sLO https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64
    - mv cosign-linux-amd64 /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    - aws ecr get-login-password --region $ECR_REGION | cosign login $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com --username AWS --password-stdin
  script:
    - echo "$COSIGN_PRIVATE_KEY" > cosign.key
    - echo "Signing image with cosign private key"
    - cosign sign --yes --key cosign.key
        $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com/$ECR_NAMESPACE/$CI_PROJECT_NAME:$IMAGE_TAG
  after_script:
    - rm -f cosign.key
  tags:
    - shared
  needs:
    - docker_build

# ─────────────────────────────────────────────────────────────
# OPTIONAL but recommended: verify the signature right here in
# the pipeline too — fail fast before GitOps even updates the
# manifest, rather than only relying on the cluster admission
# controller to catch a bad/missing signature later.
# ─────────────────────────────────────────────────────────────
verify_image_signature:
  stage: sign
  image: alpine:3.19
  variables:
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    COSIGN_VERSION: "v2.2.4"
  before_script:
    - apk add --no-cache curl aws-cli
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID_DEV
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY_DEV
    - export AWS_DEFAULT_REGION=$ECR_REGION
    - curl -sLO https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64
    - mv cosign-linux-amd64 /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    - aws ecr get-login-password --region $ECR_REGION | cosign login $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com --username AWS --password-stdin
  script:
    - echo "$COSIGN_PUBLIC_KEY" > cosign.pub
    - echo "Verifying image signature with cosign public key"
    - cosign verify --key cosign.pub
        $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com/$ECR_NAMESPACE/$CI_PROJECT_NAME:$IMAGE_TAG
  after_script:
    - rm -f cosign.pub
  tags:
    - shared
  needs:
    - sign_image

update_gitops_manifest:
  stage: gitops
  image: alpine:latest
  variables:
    IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
  before_script:
    - apk add --no-cache git sed
  script:
    - echo "test"
    - export IMAGE_TAG="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    - 'sed -i "s|image:.*|image: $AWS_ACCOUNT_ID_DEV.dkr.ecr.$ECR_REGION.amazonaws.com/$ECR_NAMESPACE/$CI_PROJECT_NAME:$IMAGE_TAG|g" k8s-manifests/rollout.yaml'
    - git config --global user.email "gitlab-ci@gitlab.local"
    - git config --global user.name "GitLab-CI"
    - git add k8s-manifests/rollout.yaml
    - git commit -m "Updated image tag to $IMAGE_TAG [skip ci]" || true
    - git push http://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:argocd-deployment	
  tags:
    - shared
  needs:
    - docker_build
    - verify_image_signature   # NEW: don't update GitOps manifest unless signature is verified

trivy-scan:
  stage: security
  image:
    name: aquasec/trivy
    entrypoint: [""]
  tags:
    - shared
  script:
    - trivy image --severity HIGH,CRITICAL $CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA

checkov_scan:
  stage: security
  image:
    name: bridgecrew/checkov
    entrypoint: [""]
  tags:
    - shared  
  script:
    - checkov -d .
